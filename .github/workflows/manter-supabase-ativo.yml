# Robô que impede o Supabase gratuito de pausar por inatividade (pausa após 7 dias sem uso).
# Faz uma consulta leve no banco a cada 2 dias e registra a execução no repositório,
# o que também impede o GitHub de desligar o agendamento (ele desliga após 60 dias sem atividade).
name: Manter Supabase ativo

on:
  schedule:
    - cron: '17 11 */2 * *'   # a cada 2 dias, 08:17 no horário de Brasília
  workflow_dispatch:          # botão "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        env:
          # Um projeto por linha: URL|chave publicável|tabela
          # Para manter outros sistemas ativos, acrescente linhas aqui.
          PROJETOS: |
            https://egfllelbtssxiheynjyn.supabase.co|sb_publishable_Adx7Xj0zP6MGqIebsZPXsA_I76uUvT7|licencas_ambientais
        run: |
          falhou=0
          while IFS='|' read -r URL KEY TABELA; do
            [ -z "$URL" ] && continue
            code=$(curl -s -o resp.txt -w '%{http_code}' --max-time 60 \
              "$URL/rest/v1/$TABELA?select=id&limit=1" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
            echo "$URL → HTTP $code"
            if [ "$code" -ge 400 ] || [ "$code" = "000" ]; then
              cat resp.txt; echo; falhou=1
            fi
          done <<< "$PROJETOS"
          exit $falhou

      - uses: actions/checkout@v4

      - name: Registrar execução
        run: |
          mkdir -p .github
          date -u '+%Y-%m-%d %H:%M UTC' > .github/ultima-execucao.txt
          git config user.name  "robo-supabase"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ultima-execucao.txt
          git commit -m "Robô: Supabase ativo em $(date -u +%F)" || exit 0
          git push
